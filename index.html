<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142846">
<meta name="description" content="BOS MUDA FINANCE - catat keuangan semudah chat.">
<meta name="application-name" content="BOS MUDA FINANCE">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>BOS MUDA FINANCE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#19283d;font:15px system-ui,Arial}
header{background:linear-gradient(120deg,#142846,#28518a);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:11px;min-height:66px}
header img{width:42px;height:42px;border-radius:12px}header b{font-size:16px;letter-spacing:.5px}header small{display:block;color:#d7e4f5;font-size:10px;letter-spacing:1px}
main{height:calc(100dvh - 66px);padding:0}
iframe{display:block;border:0;width:100%;height:100%;background:white}
.notice{padding:20px;text-align:center;color:#64748b}
</style>
</head>
<body>
<header><img src="./icon-192.png" alt="Logo BOS MUDA FINANCE"><div><b>BOS MUDA FINANCE</b><small>PERSONAL FINANCE MANAGEMENT</small></div></header>
<main id="app"><div class="notice">Menghubungkan aplikasi keuangan…</div></main>
<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCy658Q_ZI8oHaAbUAWsqrKNwzYpQ_BY_HglISU3m0MsX_WezqLnjCNwJKSXPMtW-m/exec";
const frame=document.createElement("iframe");
frame.title="BOS MUDA FINANCE";
frame.allow="camera; clipboard-read; clipboard-write";
frame.referrerPolicy="strict-origin-when-cross-origin";
frame.src=APPS_SCRIPT_URL;
document.getElementById("app").replaceChildren(frame);

if ("serviceWorker" in navigator) {
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./service-worker.js").catch(err=>console.warn("Service worker:",err));
  });
}
</script>
</body>
</html>
